name: CI-CD for CropCure

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --quiet

      # Step 4: Run tests
      - name: Run tests
        run: pytest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code for deploy
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Debug HF_TOKEN (optional, remove in production)
      - name: Debug HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "HF_TOKEN length: ${#HF_TOKEN}"
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is empty. Check repository secrets!"
            exit 1
          fi

      # Step 3: Deploy to Hugging Face Space
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git user
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Prepare Hugging Face repo URL
          REPO_URL="https://$HF_TOKEN@huggingface.co/spaces/Sai240723/CropCure"

          # Add or update remote 'space' safely
          if git remote get-url space 2>/dev/null; then
              git remote set-url space $REPO_URL
          else
              git remote add space $REPO_URL
          fi

          # Commit and push changes if any
          if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "Automated commit from GitHub Actions"
              git push space main --force
          else
              echo "No changes to commit"
          fi
