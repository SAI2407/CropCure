name: CI-CD for CropCure

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --quiet

      # Step 4: Run tests
      - name: Run tests
        run: pytest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code for deploy
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Debug HF_TOKEN
      - name: Debug HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "HF_TOKEN length: ${#HF_TOKEN}"
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is empty. Check repository secrets!"
            exit 1
          fi

      # Step 3: Deploy to Hugging Face Space
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git user
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Create a temporary directory for the Hugging Face repo
          mkdir -p /tmp/hf-deploy
          cd /tmp/hf-deploy
          
          # Clone the Hugging Face repository
          git clone https://$HF_TOKEN@huggingface.co/spaces/Sai240723/CropCure .
          
          # Remove all existing files except .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          
          # Copy all files from the GitHub repo
          cp -r $GITHUB_WORKSPACE/* .
          cp -r $GITHUB_WORKSPACE/.* . 2>/dev/null || true
          
          # Clean up files that shouldn't be in the Space
          rm -rf .git .github __pycache__ *.pyc
          
          # Add all files
          git add .
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated update from GitHub Actions"
            git push origin main
          else
            echo "No changes to commit"
          fi