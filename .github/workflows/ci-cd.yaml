name: CI-CD for CropCure 

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests
      - name: Run tests
        run: pytest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 5: Deploy to Hugging Face Space
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Add or update remote 'space' with HF token
          if git remote | grep -q space; then
              git remote set-url space https://$HF_TOKEN@huggingface.co/spaces/sai240723/CropCure
          else
              git remote add space https://$HF_TOKEN@huggingface.co/spaces/sai240723/CropCure
          fi

          # Commit and push changes
          git add .
          git commit -m "Automated commit from GitHub Actions" || echo "No changes to commit"
          git push space main --force
