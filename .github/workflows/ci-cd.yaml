name: CI-CD for CropCure

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --quiet

      # Step 4: Run tests
      - name: Run tests
        run: pytest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code for deploy
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Step 2: Debug HF_TOKEN
      - name: Debug HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "HF_TOKEN length: ${#HF_TOKEN}"
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is empty. Check repository secrets!"
            exit 1
          fi

      # Step 3: Install huggingface_hub
      - name: Install huggingface_hub
        run: pip install huggingface_hub

      # Step 4: Upload to Hugging Face using the Python library
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi, upload_folder
          
          # Initialize API
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          # Upload entire folder to Space
          api.upload_folder(
              folder_path='.',
              repo_id='Sai240723/CropCure',
              repo_type='space',
              ignore_patterns=['.git*', '.github*', '__pycache__*', '*.pyc', 'README.md']
          )
          print('Upload completed successfully!')
          "